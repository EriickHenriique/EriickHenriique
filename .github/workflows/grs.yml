name: Update README cards
on:
  schedule:

    - cron: "0 3 * * *"
  workflow_dispatch: # Permite que você rode o script manualmente clicando num botão

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Gera o seu card principal de estatísticas
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Eriickhenriique&show_icons=true&theme=dark&card_width=400
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Gera o seu card de top linguagens
      - name: Generate top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=EriickHenriique&layout=compact&theme=dark&card_width=400
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Salva (commita) as imagens recém-geradas no seu repositório
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push